[project]
name = "web3-job-crawler"
version = "0.1.0"
description = "Scrape Web3 junior/entry-level remote job listings from multiple sources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "go99further" },
]
keywords = ["web3", "jobs", "scraper", "blockchain", "remote", "junior", "entry-level"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/go99further/web3-job-crawler"
Repository = "https://github.com/go99further/web3-job-crawler"
Issues = "https://github.com/go99further/web3-job-crawler/issues"

[project.scripts]
web3-jobs = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
